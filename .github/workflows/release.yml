name: Release

# Pipeline shape (and why it is shaped this way):
#
#   release ──┬── sign-macos ──┬── checksums ──┬── mirror ───┐
#             └── sign-windows ┘               └── homebrew ─┼── notify
#             (parallel)                        (parallel)   ┘
#
# Ordering rules that are load-bearing:
#
#  * Nothing that talks to the Homebrew tap runs before signing. Until
#    v1.2.51 GoReleaser pushed the tap at the end of the `release` job, so an
#    expired HOMEBREW_TAP_GITHUB_TOKEN failed that job and *skipped both
#    signing jobs*. Five releases (v1.2.47–v1.2.51) shipped unsigned macOS
#    and Windows binaries before anyone noticed. The tap is now the last
#    thing to happen, and it cannot take anything else down with it.
#
#  * checksums.txt is written by exactly one job, once, after every artifact
#    has reached its final form. The signing jobs used to each download,
#    regex-patch and re-upload the shared file, which is why sign-windows had
#    to wait on sign-macos. With a single writer they run in parallel.
#
#  * Everything that republishes artifacts elsewhere hangs off `checksums`, not
#    off `release`. `mirror` (install.dibbla.com, P-0020) and `homebrew` are
#    siblings for the same reason: both copy the final, signed bytes and the
#    checksums that match them. A mirror built from `release` would serve
#    pre-signing darwin/windows archives with post-signing checksums.

on:
  push:
    tags:
      - "v*"
  # The emergency exit. release.yml used to be reachable only by pushing a `v*`
  # tag, so a release that died for reasons of its own -- the GitHub Actions
  # outage of 2026-08-26 stranded v1.2.66 with the tag public and no release
  # object at all -- could only be retried by pushing a NEW tag. That is a
  # public event requiring the user's confirmation every time (CLAUDE.md), and
  # it burns a version number to work around an infrastructure fault.
  #
  # Same shape as publish-skill.yml and mirror-redeploy.yml, which have had
  # `workflow_dispatch` for exactly this reason.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v1.2.66). It must already exist; this never creates a tag."
        required: true
        type: string
      force:
        description: "Rebuild a release that already looks COMPLETE. Normally left off: the exit is for repairing a broken release, not for overwriting a good one. See the preflight step for what this costs."
        required: false
        default: false
        type: boolean

# THE tag this run is about, resolved once.
#
# Every job below used to read `github.ref_name`, i.e. "whatever ref started
# this run". On a tag push that IS the tag. On a workflow_dispatch it is the
# BRANCH the dispatch was made from (`main`), and the whole pipeline would go
# looking for `dibbla_main_darwin_amd64.tar.gz`. Worse, the three prerelease
# guards would have tested the string `main` instead of the tag, so a dispatch
# of `v1.2.52-rc.1` would have moved latest.json, the Homebrew formula and
# `:latest` to a release candidate -- silently, which is the failure mode that
# actually costs something.
#
# `github.event.inputs.tag` rather than `inputs.tag`: the `github` context is
# available everywhere this is needed, including `concurrency` and job-level
# `if:`, and `inputs` is not. On a tag push `github.event.inputs` is undefined,
# so this falls back to `github.ref_name` and the tag-push path is unchanged.
env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Never let two runs race over the same release assets -- and that now includes
# a tag push and a dispatch naming the same tag, which is precisely the
# collision the emergency exit makes possible. Keyed on the resolved tag rather
# than on `github.ref`, which for a dispatch would be `refs/heads/main` and
# would put every dispatch, of every tag, in one group.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Everything downstream hangs off this job, so this is the one place a
      # bad dispatch input can be stopped before it costs twenty minutes and
      # touches anything public.
      - name: Validate the tag being released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on a tag push, so a push can never be a "force".
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          echo "event=$GITHUB_EVENT_NAME  resolved tag=${RELEASE_TAG:-<empty>}"

          [ -n "${RELEASE_TAG:-}" ] || { echo "::error::RELEASE_TAG is empty"; exit 1; }

          # The same shape the push trigger accepts. Without this an operator
          # who types a branch name gets a green checkout and a confusing
          # GoReleaser failure instead of an answer.
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$RELEASE_TAG' is not a v* tag name"; exit 1 ;;
          esac

          # Must exist, and must exist as a TAG -- checking the tags namespace
          # specifically, so a branch that happens to be named like a tag
          # cannot be released.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha \
            || { echo "::error::tag '$RELEASE_TAG' does not exist. This workflow never creates tags."; exit 1; }

          # Decide, do not merely report.
          #
          # .goreleaser.yml sets `replace_existing_artifacts: true` so that a
          # re-run can REPAIR a release rather than dying on the first
          # duplicate upload. That flag on its own is a bad trade: a re-run
          # also replaces the SIGNED darwin archives with the unsigned ones
          # GoReleaser just built, and sign-macos only puts that right if the
          # run reaches it. A run cancelled in between would leave the release
          # worse than it found it -- and unlike a normal release, which only
          # ever moves forward, a repair can move backwards.
          #
          # So the flag is paired with this guard, and the semantics are "fix
          # what is broken", never "always overwrite": a release that already
          # looks complete is refused unless the operator explicitly forces it.
          VERSION="${RELEASE_TAG#v}"

          # The 12 assets a finished release carries -- 6 archives, 4 packages,
          # checksums.txt and the skill zip. Measured against v1.2.63, v1.2.64
          # and v1.2.65, which have exactly these and nothing else. Checked by
          # NAME rather than by count, so a release missing one specific
          # archive is still recognised as incomplete.
          EXPECTED="$(cat <<EOF
          dibbla_${VERSION}_darwin_amd64.tar.gz
          dibbla_${VERSION}_darwin_arm64.tar.gz
          dibbla_${VERSION}_linux_amd64.tar.gz
          dibbla_${VERSION}_linux_arm64.tar.gz
          dibbla_${VERSION}_windows_amd64.zip
          dibbla_${VERSION}_windows_arm64.zip
          dibbla_${VERSION}_linux_amd64.deb
          dibbla_${VERSION}_linux_arm64.deb
          dibbla_${VERSION}_linux_amd64.rpm
          dibbla_${VERSION}_linux_arm64.rpm
          checksums.txt
          dibbla-cli-skill.zip
          EOF
          )"
          EXPECTED="$(printf '%s\n' "$EXPECTED" | sed 's/^ *//')"

          # This lookup is the ONLY thing standing between a dispatch and an
          # overwrite, now that .goreleaser.yml sets
          # `replace_existing_artifacts`. Before that flag, GoReleaser itself
          # refused to clobber an existing asset and was a second line of
          # defence; there is no second line any more.
          #
          # So it fails CLOSED. Only two answers let the run continue: an
          # affirmative "this release does not exist", or a well-formed list of
          # its assets. An API error, a rate limit, an expired token, a timeout
          # or a malformed body all STOP the run. The earlier version treated
          # every failure as "no release yet" and carried on -- against a
          # complete release that meant silently overwriting signed archives.
          ERR="$(mktemp)"
          if ASSETS_JSON="$(gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json assets 2>"$ERR")"; then
            :
          else
            if grep -qi 'release not found' "$ERR"; then
              echo "No release object for $RELEASE_TAG yet -- GoReleaser will create it."
              rm -f "$ERR"; exit 0
            fi
            echo "::error::could not determine what release $RELEASE_TAG already contains:"
            sed 's/^/::error::  /' "$ERR" >&2
            echo "::error::Refusing to continue: proceeding blind could overwrite a signed release."
            rm -f "$ERR"; exit 1
          fi
          rm -f "$ERR"

          # A successful call is not the same as a usable answer. Require the
          # shape before trusting the contents, so a changed schema or a
          # truncated body cannot read as "this release has no assets" -- which
          # would look exactly like an incomplete release and be repaired over.
          if ! printf '%s' "$ASSETS_JSON" | jq -e 'has("assets") and (.assets | type == "array")' >/dev/null 2>&1; then
            echo "::error::unexpected response shape when reading release $RELEASE_TAG; refusing to continue."
            printf '%s\n' "$ASSETS_JSON" | head -c 500 >&2
            exit 1
          fi
          PRESENT="$(printf '%s' "$ASSETS_JSON" | jq -r '.assets[].name')"

          MISSING="$(comm -23 <(printf '%s\n' "$EXPECTED" | sort) <(printf '%s\n' "$PRESENT" | sort))"

          if [ -n "$MISSING" ]; then
            echo "::notice::release $RELEASE_TAG exists but is INCOMPLETE; repairing it. Missing:"
            printf '  - %s\n' $MISSING
            exit 0
          fi

          if [ "${FORCE:-}" = "true" ]; then
            echo "::warning::release $RELEASE_TAG already has all 12 expected assets, and force=true was given. Rebuilding it."
            echo "::warning::If this run does not reach sign-macos/sign-windows, the release will be left carrying UNSIGNED archives."
            exit 0
          fi

          echo "::error::release $RELEASE_TAG already has all 12 expected assets -- it is complete, so there is nothing to repair."
          echo "::error::This workflow's manual trigger exists to finish a BROKEN release. Rebuilding a good one"
          echo "::error::replaces its signed archives with unsigned ones until signing runs again."
          echo "::error::If you really mean to, re-dispatch with force=true."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Pinned to the resolved tag rather than left to the default. On a tag
          # push this is the same commit the default would have given; on a
          # dispatch it is the difference between GoReleaser building the tag
          # and GoReleaser refusing to build an untagged `main`.
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Single source of truth: go.mod's `go` directive, which is both the
          # published compatibility floor for `go install` and the version we
          # build with. Bump it there, not here — hardcoding a version in the
          # workflow is the drift ea9125f fixed. See CLAUDE.md for why there is
          # deliberately no `toolchain` directive (Snyk cannot parse it).
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          # No HOMEBREW_TAP_GITHUB_TOKEN here on purpose — GoReleaser no
          # longer touches the tap, so a tap credential problem can no longer
          # abort the build. See the `homebrew` job and .goreleaser.yml.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and attach skill archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Packaged from the editable source dir, matching prior releases.
          ( cd .claude/skills && zip -qr ../../dist/dibbla-cli-skill.zip dibbla/ )
          gh release upload "$RELEASE_TAG" dist/dibbla-cli-skill.zip --clobber

  sign-macos:
    name: Sign and notarize macOS
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Install Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign, notarize and republish darwin archives
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          WORK="$RUNNER_TEMP/sign"

          for ARCH in amd64 arm64; do
            TARBALL="dibbla_${VERSION}_darwin_${ARCH}.tar.gz"
            EXTRACT="$WORK/$ARCH"
            echo "::group::Signing ${TARBALL}"

            mkdir -p "$EXTRACT"
            gh release download "$TAG" -p "$TARBALL" -D "$WORK" --clobber -R "$GITHUB_REPOSITORY"
            tar -xzf "$WORK/$TARBALL" -C "$EXTRACT"

            test -f "$EXTRACT/dibbla" || { echo "::error::dibbla binary missing from $TARBALL"; exit 1; }

            codesign --force --options runtime \
              --sign "$APPLE_DEVELOPER_ID" \
              --timestamp \
              "$EXTRACT/dibbla"
            codesign --verify --strict --verbose=2 "$EXTRACT/dibbla"

            ditto -c -k "$EXTRACT/dibbla" "$WORK/notarize-${ARCH}.zip"
            xcrun notarytool submit "$WORK/notarize-${ARCH}.zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            # A bare Mach-O executable cannot carry a stapled ticket, so there
            # is no `stapler staple` here — Gatekeeper verifies these online.

            # Repack from inside the extract dir so entries keep the flat names
            # GoReleaser produced (`README.md`, `dibbla`). The old `-C ... .`
            # form rewrote them as `./dibbla`, gratuitously differing from the
            # untouched linux archives.
            ( cd "$EXTRACT" && tar -czf "$WORK/$TARBALL" -- * )

            gh release upload "$TAG" "$WORK/$TARBALL" --clobber -R "$GITHUB_REPOSITORY"
            echo "::endgroup::"
          done

          # checksums.txt is deliberately NOT touched here; the `checksums`
          # job regenerates it once both signing jobs have finished.

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi

  sign-windows:
    name: Sign Windows
    # Only needs `release`. It used to also need sign-macos purely because both
    # jobs rewrote checksums.txt; that file now has a single writer downstream.
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download and stage Windows binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:RELEASE_TAG"
          $version = $tag -replace '^v', ''
          $signDir = Join-Path $env:RUNNER_TEMP 'sign'
          New-Item -ItemType Directory -Force -Path $signDir | Out-Null

          foreach ($arch in @('amd64', 'arm64')) {
            $zip = "dibbla_${version}_windows_${arch}.zip"
            gh release download $tag -p $zip -D $signDir --clobber -R $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to download $zip" }
            $dest = Join-Path $signDir $arch
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Expand-Archive -Path (Join-Path $signDir $zip) -DestinationPath $dest -Force
            if (-not (Test-Path (Join-Path $dest 'dibbla.exe'))) { throw "dibbla.exe not found in $zip" }
          }

          "TAG=$tag"          | Out-File -FilePath $env:GITHUB_ENV -Append
          "VERSION=$version"  | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGN_DIR=$signDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign Windows binaries
        uses: azure/trusted-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ env.SIGN_DIR }}
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify, repackage and publish signed binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }

          foreach ($arch in @('amd64', 'arm64')) {
            $exe = Join-Path $env:SIGN_DIR "$arch\dibbla.exe"
            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $arch" }

            $zip = "dibbla_${env:VERSION}_windows_${arch}.zip"
            $zipPath = Join-Path $env:SIGN_DIR $zip
            Remove-Item $zipPath -Force
            Compress-Archive -Path $exe -DestinationPath $zipPath -Force
            gh release upload $env:TAG $zipPath --clobber -R $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $zip" }
          }

          # checksums.txt is deliberately NOT touched here; see the `checksums` job.

  checksums:
    name: Regenerate checksums
    needs: [release, sign-macos, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rebuild checksums.txt from the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"

          # Recomputing from what is actually attached to the release beats
          # patching individual lines with sed/regex: it cannot drift, and it
          # also covers assets GoReleaser never knew about (the skill archive).
          mkdir -p assets
          gh release download "$TAG" -D assets --clobber -R "$GITHUB_REPOSITORY"
          rm -f assets/checksums.txt

          ( cd assets && sha256sum -- * ) > checksums.txt

          echo "::group::checksums.txt"
          cat checksums.txt
          echo "::endgroup::"

          gh release upload "$TAG" checksums.txt --clobber -R "$GITHUB_REPOSITORY"

  mirror:
    name: Publish the install.dibbla.com mirror
    # A SIBLING of homebrew, and for the same reason: `needs: checksums` is what
    # guarantees the mirror publishes the *signed* binaries and the checksums
    # that match them. Hanging this off `release` instead would republish
    # pre-signing darwin/windows archives — the exact bug .goreleaser.yml:53-67
    # records for the old Homebrew step. Do not reorder.
    needs: checksums
    # Serialized against mirror-redeploy.yml, which publishes the same app on a
    # push to main. Two concurrent `dibbla deploy --update` calls on one alias
    # would race, and the loser could leave `latest.json` describing a `/latest/`
    # it does not match.
    concurrency:
      group: installer-site-mirror
      cancel-in-progress: false
    # Prereleases publish nothing here. `latest.json` and `/latest/` must stay
    # consistent with each other, so an -rc tag either moves both or neither;
    # moving `latest` to an rc would hand every new install a release candidate.
    # Same rule and same reasoning as the homebrew job below.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # The TAG's tree, not the default branch's. On a tag push these are the
        # same thing; on a dispatch they are not, and this job reads files from
        # the checkout (installer-site/stage.sh and wait-ready.sh), so an unpinned checkout would build the tag's
        # binaries with main's supporting files.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Stage the mirror
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./installer-site/stage.sh "$RELEASE_TAG" https://install.dibbla.com

          # A mirror whose tag_name disagrees with the tag being released is
          # worse than no mirror: it silently pins every new install to another
          # version. Assert it before anything is deployed.
          STAGED="$(jq -r .tag_name installer-site/public/latest.json)"
          [ "$STAGED" = "$RELEASE_TAG" ] || {
            echo "latest.json tag_name=$STAGED but RELEASE_TAG=$RELEASE_TAG" >&2
            exit 1
          }

          echo "::group::latest.json"
          cat installer-site/public/latest.json
          echo "::endgroup::"

      - name: Install the Dibbla CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Installed from the GitHub release, NOT from install.dibbla.com.
          #
          # This job's whole purpose is to deploy the install app, so it must not
          # depend on that app already working: if the mirror is broken or serving
          # a bad script, bootstrapping from it means the job cannot deploy the
          # fix, and recovery becomes a manual out-of-band deploy. GitHub is
          # reachable from Actions runners by definition — the 403 that motivated
          # P-0020 is a sandbox restriction, not a GitHub one — so taking the
          # binary straight off the release we just published breaks the cycle.
          TAG="$RELEASE_TAG"
          gh release download "$TAG" -p "dibbla_${TAG#v}_linux_amd64.tar.gz" -D cli --clobber -R "$GITHUB_REPOSITORY"

          # Verify it the same way the installer would, against the checksums the
          # `checksums` job regenerated from the signed assets.
          gh release download "$TAG" -p checksums.txt -D cli --clobber -R "$GITHUB_REPOSITORY"
          ( cd cli && sha256sum -c --ignore-missing checksums.txt )

          mkdir -p "$HOME/.local/bin"
          tar -xzf "cli/dibbla_${TAG#v}_linux_amd64.tar.gz" -C cli
          install -m 0755 cli/dibbla "$HOME/.local/bin/dibbla"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy the install app
        env:
          # A bare user-identity bearer with no scopes (auth-service ApiToken has
          # no per-app or per-permission column), so it can deploy any app in the
          # org. Accepted knowingly; a dedicated service user is the follow-up.
          DIBBLA_API_TOKEN: ${{ secrets.DIBBLA_API_TOKEN }}
          DIBBLA_API_URL: https://api.dibbla.com
        run: |
          set -euo pipefail
          # --update, never --force: --force tears the app down, and this app is
          # on the critical path for every new install.
          dibbla deploy ./installer-site \
            --alias install \
            --update \
            -m "P-0020 mirror: $RELEASE_TAG"

      - name: Wait for the app to serve the new tag
        run: ./installer-site/wait-ready.sh https://install.dibbla.com "$RELEASE_TAG"

      - name: Verify the published bytes
        run: |
          set -euo pipefail
          BASE=https://install.dibbla.com

          # Same check P-0016 Part C applies to the hosted skill index: fetch what
          # the origin actually serves and re-hash it. A green deploy proves the
          # app started, not that it serves the right bytes.
          curl -fsSL "$BASE/latest.json" -o live-latest.json
          LIVE_TAG="$(jq -r .tag_name live-latest.json)"
          [ "$LIVE_TAG" = "$RELEASE_TAG" ] || {
            echo "live latest.json says $LIVE_TAG, expected $RELEASE_TAG" >&2
            exit 1
          }

          curl -fsSL "$BASE/checksums.txt" -o live-checksums.txt

          # Assert there is something to verify BEFORE the loop. The loop below
          # reads from process substitution, which discards jq's exit status, so
          # an empty or absent `.assets` produced zero iterations, left fail=0,
          # and printed "Mirror verified" having checked nothing at all. The
          # tag_name assertion above would still have passed.
          ASSET_COUNT="$(jq -r '.assets | length' live-latest.json)"
          [ "$ASSET_COUNT" -ge 7 ] || {
            echo "live latest.json lists $ASSET_COUNT assets, expected at least 7 (6 archives + checksums.txt)" >&2
            exit 1
          }

          fail=0
          while read -r name url digest; do
            curl -fsSL "$url" -o asset.bin
            got="$(sha256sum asset.bin | cut -d' ' -f1)"

            want_inline="${digest#sha256:}"
            if [ "$got" != "$want_inline" ]; then
              echo "  ✗ $name: digest in latest.json is $want_inline, served bytes hash to $got" >&2
              fail=1
              continue
            fi

            # checksums.txt has no line for itself, so only cross-check archives.
            if [ "$name" != "checksums.txt" ]; then
              want_file="$(awk -v n="$name" '{ sub(/^\*/, "", $2); if ($2 == n) { print $1; exit } }' live-checksums.txt)"
              if [ "$want_file" != "$got" ]; then
                echo "  ✗ $name: checksums.txt says $want_file, served bytes hash to $got" >&2
                fail=1
                continue
              fi
            fi

            echo "  ✓ $name"
            rm -f asset.bin
          done < <(jq -r '.assets[] | "\(.name) \(.browser_download_url) \(.digest)"' live-latest.json)
          [ "$fail" -eq 0 ] || exit 1

          # The two contracts a client depends on beyond the assets: `/` answers
          # with the shell script (GitHub Pages did this with a symlink), and the
          # download terminates on our own origin. An off-origin redirect is the
          # precise failure this whole change exists to remove, so assert that
          # curl was never redirected.
          # Downloaded to a file rather than piped into `head`: under `set -o
          # pipefail`, head closing the pipe early can hand curl a write error
          # and fail this step even though the assertion passed. It happens to
          # survive today only because the script is smaller than the pipe
          # buffer — which is exactly the kind of thing that turns flaky later.
          curl -fsSL "$BASE/" -o root.sh
          head -n1 root.sh | grep -q '^#!/bin/sh' \
            || { echo "GET / did not return the shell script" >&2; exit 1; }
          curl -fsSL "$BASE/install.ps1" -o /dev/null

          ARCHIVE="$(jq -r '.assets[] | select(.name | endswith("linux_amd64.tar.gz")) | .browser_download_url' live-latest.json)"
          # -f matters: without it a 404 also yields num_redirects=0 and exit 0,
          # so a mirror serving nothing would pass this assertion.
          REDIRECTS="$(curl -fsS -o /dev/null -w '%{num_redirects}' -L "$ARCHIVE")"
          [ "$REDIRECTS" = "0" ] || {
            echo "archive download followed $REDIRECTS redirect(s); it must terminate on our own origin" >&2
            exit 1
          }

          echo "Mirror verified: $RELEASE_TAG"

  verify-windows-installer:
    name: Verify install.ps1 on Windows
    # P-0020 E2E test 5. Until this existed, install.ps1's new Assert-Checksum
    # had never been executed on any machine: `sign-windows` signs binaries and
    # never invokes the installer, despite a comment in scripts/e2e that claimed
    # otherwise. This is the only place the PowerShell path runs.
    needs: mirror
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Install from install.dibbla.com and verify
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = "$env:RELEASE_TAG".TrimStart('v')

          irm https://install.dibbla.com/install.ps1 | iex

          $exe = Join-Path $env:LOCALAPPDATA 'dibbla\dibbla.exe'
          if (-not (Test-Path $exe)) { throw "installer did not produce $exe" }

          $out = & $exe --version
          Write-Host "installed: $out"
          if ($out -notmatch [regex]::Escape($expected)) {
            throw "expected version $expected, got '$out'"
          }

      - name: A corrupted archive must be refused
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Serve a valid checksums.txt alongside deliberately wrong bytes, and
          # assert the installer aborts. Without this leg the fail-closed
          # guarantee is only ever proven on the shell side.
          $root = Join-Path $env:RUNNER_TEMP 'fixture'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'latest') | Out-Null

          $tag = "$env:RELEASE_TAG"
          $ver = $tag.TrimStart('v')
          $name = "dibbla_${ver}_windows_amd64.zip"

          irm https://install.dibbla.com/checksums.txt -OutFile (Join-Path $root 'checksums.txt')
          irm https://install.dibbla.com/install.ps1  -OutFile (Join-Path $root 'install.ps1')
          # One string, not `Join-Path $root 'latest\' + $name`: inside the
          # parentheses PowerShell parses in argument mode, so the `+` is a
          # positional argument rather than an operator. Join-Path takes it as
          # -AdditionalChildPath and builds `...\latest\+\<name>`, whose parent
          # does not exist — the step then dies here, before testing anything.
          Set-Content -Path (Join-Path $root "latest\$name") -Value 'not a zip' -NoNewline
          Set-Content -Path (Join-Path $root 'latest.json') -Value ('{"tag_name":"' + $tag + '","assets":[]}')

          $job = Start-Job -ScriptBlock {
            param($p) Set-Location $p; python -m http.server 8099
          } -ArgumentList $root
          Start-Sleep -Seconds 3

          try {
            $env:DIBBLA_INSTALL_BASE_URL = 'http://127.0.0.1:8099'
            $env:DIBBLA_INSTALLER_FORCE = '1'   # don't delegate to the dibbla already installed above
            $env:DIBBLA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'corrupt-target'

            $ErrorActionPreference = 'Continue'
            $out = & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $root 'install.ps1') 2>&1 | Out-String
            $rc = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'

            Write-Host $out

            if ($rc -eq 0) { throw "installer exited 0 on a corrupted archive" }

            # A non-zero exit on its own is not evidence of a refusal. For three
            # releases this assertion passed while the installer was merely
            # failing to parse under PowerShell 5.1 (DIB-324) and never reached
            # the checksum at all. Require the refusal it exists to test.
            if ($out -notmatch 'Checksum mismatch') {
              throw "installer exited $rc without reporting a checksum mismatch, so the refusal was not what was tested"
            }

            $left = Join-Path $env:DIBBLA_INSTALL_DIR 'dibbla.exe'
            if (Test-Path $left) { throw "installer left a binary behind after a checksum failure" }
            Write-Host "refused correctly (exit $rc), nothing written"
          }
          finally {
            Stop-Job $job -ErrorAction SilentlyContinue
            Remove-Job $job -Force -ErrorAction SilentlyContinue
          }

          # The assertions above decide this step. Without an explicit success
          # the inner installer's $LASTEXITCODE - deliberately non-zero, since
          # refusing is the pass condition - leaks out as the step's exit code,
          # which is what has been failing every release since v1.2.55. An
          # assertion that throws still fails the step: the throw terminates
          # the script before this line is reached.
          exit 0

  homebrew:
    name: Update Homebrew tap
    needs: checksums
    # Stable releases only. `brew install dibbla` tracks the single formula in
    # the tap, so publishing a release candidate there would hand every Homebrew
    # user an rc. SemVer prerelease identifiers always contain a hyphen
    # (v1.2.52-rc.1); stable tags (v1.2.52) never do — the same rule GoReleaser's
    # `prerelease: auto` uses to decide how to mark the GitHub release.
    #
    # Everything upstream (build, both signing jobs, checksums) still runs for a
    # prerelease, which is what makes `-rc` tags usable as a full rehearsal.
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        # The TAG's tree, not the default branch's. On a tag push these are the
        # same thing; on a dispatch they are not, and this job reads files from
        # the checkout (.github/homebrew/dibbla.rb.tmpl), so an unpinned checkout would build the tag's
        # binaries with main's supporting files.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Render formula from the final checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v envsubst >/dev/null || sudo apt-get install -y --no-install-recommends gettext-base

          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"

          gh release download "$TAG" -p checksums.txt -D . --clobber -R "$GITHUB_REPOSITORY"

          # Match on the exact filename rather than relying on line order.
          sha_for() { awk -v f="$1" '$2 == f { print $1 }' checksums.txt; }

          SHA_DARWIN_AMD64="$(sha_for "dibbla_${VERSION}_darwin_amd64.tar.gz")"
          SHA_DARWIN_ARM64="$(sha_for "dibbla_${VERSION}_darwin_arm64.tar.gz")"
          SHA_LINUX_AMD64="$(sha_for "dibbla_${VERSION}_linux_amd64.tar.gz")"
          SHA_LINUX_ARM64="$(sha_for "dibbla_${VERSION}_linux_arm64.tar.gz")"
          export VERSION SHA_DARWIN_AMD64 SHA_DARWIN_ARM64 SHA_LINUX_AMD64 SHA_LINUX_ARM64

          # Validate separately: `export VAR=$(...)` masks the substitution's
          # exit status, so a guard inside sha_for could never fail the step.
          bad=0
          for var in SHA_DARWIN_AMD64 SHA_DARWIN_ARM64 SHA_LINUX_AMD64 SHA_LINUX_ARM64; do
            if ! printf '%s' "${!var}" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::$var is not a sha256 — missing from checksums.txt? (got '${!var}')"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

          # Explicit variable list so envsubst leaves anything else literal;
          # with no list it would silently blank out unknown placeholders and
          # the guard below could never fire.
          envsubst '${VERSION} ${SHA_DARWIN_AMD64} ${SHA_DARWIN_ARM64} ${SHA_LINUX_AMD64} ${SHA_LINUX_ARM64}' \
            < .github/homebrew/dibbla.rb.tmpl > dibbla.rb

          if grep -q '\${' dibbla.rb; then
            echo "::error::Unsubstituted placeholder left in the rendered formula"
            grep -n '\${' dibbla.rb
            exit 1
          fi
          ruby -c dibbla.rb

          echo "::group::Formula/dibbla.rb"
          cat dibbla.rb
          echo "::endgroup::"

      - name: Push to dibbla-agents/homebrew-tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # gh must authenticate as the tap token, not the workflow token,
          # so the preflight below actually tests the credential we rely on.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"

          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set. Create a PAT with"
            echo "::error::write access to dibbla-agents/homebrew-tap and add it as a repo secret."
            exit 1
          fi

          # Fail loudly and specifically on an expired/insufficient token — the
          # 401 that broke v1.2.47+ was buried in GoReleaser's output.
          if ! gh api repos/dibbla-agents/homebrew-tap --silent 2>/dev/null; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN cannot read dibbla-agents/homebrew-tap"
            echo "::error::(expired, revoked, or missing repo scope). Rotate the secret and re-run this job."
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/dibbla-agents/homebrew-tap.git" tap

          mkdir -p tap/Formula
          cp dibbla.rb tap/Formula/dibbla.rb

          cd tap
          git add Formula/dibbla.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for v${VERSION}"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "dibbla ${VERSION}"
          git push origin HEAD
          echo "✓ Tap updated to v${VERSION} with signed checksums"

  container:
    name: Publish the container image
    # Sibling of `mirror` and `homebrew`, and off `checksums` for the same
    # reason (CLAUDE.md, "release.yml job order is load-bearing", rule 3): this
    # job republishes an artifact, so it must copy the final bytes together with
    # the checksums that match them. Building off `release` would bake a
    # pre-signing tree into an image tagged as the release.
    #
    # Linux archives are not touched by either signing job today, so in practice
    # the bytes are the same either way. Hanging off `checksums` regardless
    # keeps the rule intact rather than resting on that staying true.
    needs: checksums
    # No prerelease guard, deliberately. Unlike `latest.json` and the Homebrew
    # formula, an immutable `1.2.52-rc.1` image moves nothing that users track,
    # and it lets a consuming pipeline rehearse against an rc — the property the
    # homebrew job's comment describes for everything upstream of it. The one
    # moving tag, `:latest`, is held back for stable releases in the push step.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        # The TAG's tree, not the default branch's. On a tag push these are the
        # same thing; on a dispatch they are not, and this job reads files from
        # the checkout (.github/docker/Dockerfile and Dockerfile.distroless), so an unpinned checkout would build the tag's
        # binaries with main's supporting files.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Stage the published linux binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"

          # Assemble the image from the published archives rather than building
          # from source, so the binary in the image is byte-identical to the one
          # on the release and on install.dibbla.com. A `go build` here would be
          # a second, unverified binary wearing the same version number.
          gh release download "$TAG" -D assets --clobber -R "$GITHUB_REPOSITORY" \
            -p "dibbla_${VERSION}_linux_amd64.tar.gz" \
            -p "dibbla_${VERSION}_linux_arm64.tar.gz" \
            -p checksums.txt

          # --ignore-missing: checksums.txt covers every published asset, and
          # only the two linux archives were downloaded.
          ( cd assets && sha256sum --check --ignore-missing checksums.txt )

          # The Dockerfile COPYs stage/linux_$TARGETARCH/dibbla. Staging into a
          # dedicated context directory keeps the build context to two binaries
          # instead of shipping the whole worktree to the daemon.
          for arch in amd64 arm64; do
            mkdir -p "oci-context/stage/linux_${arch}"
            tar -xzf "assets/dibbla_${VERSION}_linux_${arch}.tar.gz" \
              -C "oci-context/stage/linux_${arch}" dibbla
          done

          chmod 0755 oci-context/stage/linux_amd64/dibbla oci-context/stage/linux_arm64/dibbla
          ls -l oci-context/stage/linux_amd64/dibbla oci-context/stage/linux_arm64/dibbla

      - name: Build and push
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/dibbla-cli"

          # GITHUB_TOKEN with `packages: write` rather than a PAT. CLAUDE.md
          # records HOMEBREW_TAP_GITHUB_TOKEN silently expiring and taking a
          # release down with it; the built-in token cannot expire, so this
          # publishing path has no credential to rotate.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # A multi-arch build needs the docker-container driver; the default
          # docker driver cannot emit a manifest list. Created inline rather
          # than via docker/setup-buildx-action to keep this workflow's
          # third-party action surface where it is.
          docker buildx create --use --driver docker-container --name dibbla-cli-builder

          TAGS=(--tag "$IMAGE:$VERSION" --tag "$IMAGE:$TAG")

          # SemVer prerelease identifiers always contain a hyphen, stable tags
          # never do — the same test the homebrew job uses. `:latest` is the one
          # tag here that moves, so it only ever moves to a stable release.
          if [[ "$TAG" != *-* ]]; then
            TAGS+=(--tag "$IMAGE:latest")
          fi

          # No QEMU setup: neither Dockerfile has a RUN step, so nothing
          # executes in the target architecture and both platforms are pure COPY.
          #
          # The default image is Alpine-based. It carries a shell because CI
          # runners generate one to execute a step's commands, and an image
          # without one cannot be driven that way — see DIB-418 and the comment
          # at the top of the Dockerfile.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file .github/docker/Dockerfile \
            --build-arg VERSION="$VERSION" \
            "${TAGS[@]}" \
            --push \
            oci-context

          # The distroless variant, for steps that are a single CLI invocation
          # and want no scripting surface. Version-suffixed only: it never takes
          # `latest`, so nothing lands on it by default.
          DISTROLESS_TAGS=(--tag "$IMAGE:$VERSION-distroless" --tag "$IMAGE:$TAG-distroless")
          if [[ "$TAG" != *-* ]]; then
            DISTROLESS_TAGS+=(--tag "$IMAGE:latest-distroless")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file .github/docker/Dockerfile.distroless \
            --build-arg VERSION="$VERSION" \
            "${DISTROLESS_TAGS[@]}" \
            --push \
            oci-context

      - name: Verify the pushed image
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/dibbla-cli"

          # Runs the amd64 image natively. arm64 is not exercised here — it is
          # the same COPY of a GoReleaser-built binary, and running it would
          # mean installing QEMU purely to print a version string.
          GOT="$(docker run --rm "$IMAGE:$VERSION" --version)"
          echo "$GOT"
          [ "$GOT" = "dibbla version ${VERSION}" ] || {
            echo "image reports '${GOT}', expected 'dibbla version ${VERSION}'"
            exit 1
          }

          # ⚠️ The assertion that would have caught DIB-418. A CI runner does not
          # invoke the entrypoint — it overrides it with a generated shell script
          # and runs the step's commands inside. Proving `--version` works proves
          # nothing about that, which is exactly how an image with no shell
          # shipped as the documented default for a runner that requires one.
          SHELL_OUT="$(docker run --rm --entrypoint /bin/sh "$IMAGE:$VERSION" -c 'dibbla --version')"
          [ "$SHELL_OUT" = "dibbla version ${VERSION}" ] || {
            echo "the default image cannot run a shell-wrapped command — CI runners cannot drive it"
            exit 1
          }
          echo "shell-wrapped invocation works (the CI-runner shape)"

          # The distroless variant must NOT have a shell — that is its whole
          # point, and a silent regression to a shell-bearing base would make
          # the two tags indistinguishable.
          if docker run --rm --entrypoint /bin/sh "$IMAGE:$VERSION-distroless" -c 'true' 2>/dev/null; then
            echo "the -distroless variant has a shell; it is supposed to have none"
            exit 1
          fi
          DGOT="$(docker run --rm "$IMAGE:$VERSION-distroless" --version)"
          [ "$DGOT" = "dibbla version ${VERSION}" ] || {
            echo "distroless image reports '${DGOT}', expected 'dibbla version ${VERSION}'"
            exit 1
          }
          echo "distroless variant runs, and correctly has no shell"

          echo "Pinnable digest for consumers:"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}'

  notify:
    name: Notify Slack
    needs: [release, sign-macos, sign-windows, checksums, mirror, verify-windows-installer, homebrew, container]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Lifted to job level so the step `if` below can test it — the `secrets`
    # context is not available in a step-level `if`, but `env` is.
    env:
      SLACK_BOT_URL: ${{ secrets.SLACK_BOT_URL }}
      SLACK_CLUSTER_DNS: ${{ secrets.SLACK_CLUSTER_DNS }}
    steps:
      - name: Connect to Tailscale
        if: env.SLACK_BOT_URL != '' && env.SLACK_CLUSTER_DNS != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          version: latest

      - name: Post release status
        env:
          # SLACK_BOT_URL / SLACK_CLUSTER_DNS are inherited from the job env.
          # They live in secrets so this public repo does not map internal
          # infrastructure (same rule as the skill content — see CLAUDE.md).
          SLACK_BOT_API_SECRET: ${{ secrets.SLACK_BOT_API_SECRET }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_BOT_URL:-}" ] || [ -z "${SLACK_CLUSTER_DNS:-}" ]; then
            echo "SLACK_BOT_URL / SLACK_CLUSTER_DNS not configured — skipping notification."
            exit 0
          fi

          if [ "$FAILED" = "true" ]; then status="failed"; else status="success"; fi

          # scheme://host[:port]/path -> host
          host="${SLACK_BOT_URL#*://}"; host="${host%%/*}"; host="${host%%:*}"
          cluster_ip="$(dig +short "$SLACK_CLUSTER_DNS" @1.1.1.1 | head -1)"

          curl -fsS -X POST "$SLACK_BOT_URL" \
            --resolve "${host}:443:${cluster_ip}" \
            -H "Authorization: Bearer ${SLACK_BOT_API_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$(cat <<EOF
          {
            "service": "dibbla-cli",
            "environment": "release",
            "tag": "${RELEASE_TAG}",
            "status": "${status}",
            "actor": "${GITHUB_ACTOR}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF
          )" || true
