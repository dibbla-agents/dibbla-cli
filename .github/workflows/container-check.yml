name: Container image

# The CI image is published by the `container` job in release.yml, which only
# runs on a v* tag. Without this gate a broken Dockerfile — a base digest that
# no longer resolves, a renamed staging path, a COPY that stops matching — would
# surface mid-release, in a job sitting downstream of signing and checksums.
# That is the shape of failure CLAUDE.md records for v1.2.47–v1.2.51: something
# late in the release chain breaking and taking the release with it.
#
# This is its own workflow rather than a job in ci.yml because GitHub Actions
# supports `paths` only at workflow level, and this does not need to run on
# every PR. Same reasoning as skill-sync-check.yml.

# The two path lists are duplicated rather than shared with a YAML anchor:
# GitHub Actions' workflow parser does not resolve anchors or aliases. Keep them
# in step if you edit one.
on:
  pull_request:
    paths:
      - ".github/docker/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/container-check.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - ".github/docker/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/container-check.yml"
      - "README.md"

concurrency:
  group: container-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Image builds for both platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Same source of truth as every other workflow here — go.mod.
          go-version-file: go.mod

      - name: Stage the linux binaries
        run: |
          set -euo pipefail

          # release.yml assembles the image from the *published* archives, so
          # the shipped image carries the same bytes as the release. There is no
          # release on a PR, so build the two linux binaries here instead.
          #
          # This gate therefore checks that the Dockerfile assembles and runs —
          # not that the bytes match a release. That property only exists at tag
          # time and is release.yml's to keep.
          for arch in amd64 arm64; do
            mkdir -p "oci-context/stage/linux_${arch}"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -ldflags "-s -w -X github.com/dibbla-agents/dibbla-cli/internal/cmd.Version=0.0.0-ci" \
              -o "oci-context/stage/linux_${arch}/dibbla" ./cmd/dibbla
          done
          chmod 0755 oci-context/stage/linux_amd64/dibbla oci-context/stage/linux_arm64/dibbla
          ls -l oci-context/stage/linux_amd64/dibbla oci-context/stage/linux_arm64/dibbla

      - name: Both platforms assemble
        run: |
          set -euo pipefail

          # A manifest list needs the docker-container driver; the default
          # docker driver cannot emit one. Created inline to keep this
          # workflow's third-party action surface where it is.
          docker buildx create --use --driver docker-container --name dibbla-cli-check

          # No --push. This proves the Dockerfile assembles on both platforms
          # and that the pinned base digest still resolves — which is the part
          # that rots quietly, since a pinned digest stays fixed while upstream
          # moves on. Publishing stays in release.yml.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file .github/docker/Dockerfile \
            --build-arg VERSION=0.0.0-ci \
            --tag dibbla-cli:ci \
            oci-context

      - name: The distroless variant assembles too
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file .github/docker/Dockerfile.distroless \
            --build-arg VERSION=0.0.0-ci \
            --tag dibbla-cli:ci-distroless \
            oci-context

      - name: The image runs the way CI actually drives it
        run: |
          set -euo pipefail

          # Load the runner-native platform and execute it. Layers are already
          # cached from the steps above, so this is nearly free.
          docker buildx build --platform linux/amd64 --load \
            --file .github/docker/Dockerfile \
            --build-arg VERSION=0.0.0-ci --tag dibbla-cli:ci oci-context
          docker buildx build --platform linux/amd64 --load \
            --file .github/docker/Dockerfile.distroless \
            --build-arg VERSION=0.0.0-ci --tag dibbla-cli:ci-distroless oci-context

          GOT="$(docker run --rm dibbla-cli:ci --version)"
          if [ "$GOT" != "dibbla version 0.0.0-ci" ]; then
            echo "::error file=.github/docker/Dockerfile::image reports '${GOT}', expected 'dibbla version 0.0.0-ci'"
            exit 1
          fi

          # ⚠️ This is the assertion whose absence let DIB-418 ship. A CI runner
          # does not invoke the entrypoint: Woodpecker compiles a step's
          # `commands:` into ["/bin/sh","-c", ...] and GitLab CI does the same.
          # An image with no shell dies there before the CLI is ever reached,
          # and checking `--version` alone cannot see it.
          if ! OUT="$(docker run --rm --entrypoint /bin/sh dibbla-cli:ci -c 'dibbla --version' 2>&1)"; then
            echo "::error file=.github/docker/Dockerfile::the default image cannot run a shell-wrapped command, so no CI runner can drive it: ${OUT}"
            exit 1
          fi
          if [ "$OUT" != "dibbla version 0.0.0-ci" ]; then
            echo "::error file=.github/docker/Dockerfile::shell-wrapped run printed '${OUT}'"
            exit 1
          fi

          # The variant's defining property, asserted so it cannot silently
          # regress into being a second copy of the default image.
          if docker run --rm --entrypoint /bin/sh dibbla-cli:ci-distroless -c 'true' 2>/dev/null; then
            echo "::error file=.github/docker/Dockerfile.distroless::the -distroless variant has a shell; it is supposed to have none"
            exit 1
          fi
          if [ "$(docker run --rm dibbla-cli:ci-distroless --version)" != "dibbla version 0.0.0-ci" ]; then
            echo "::error file=.github/docker/Dockerfile.distroless::distroless variant does not run"
            exit 1
          fi

          echo "✓ default image: builds both platforms, runs, and works under a shell (the CI shape)"
          echo "✓ distroless variant: builds both platforms, runs, and has no shell"
