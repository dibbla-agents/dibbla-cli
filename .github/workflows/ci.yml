name: CI

# Build, vet and test on every PR and every push to main.
#
# Until now the only PR gate was the skill-sync check, so a change that broke
# the build was not caught until someone pushed a v* tag — at which point the
# failure surfaces as a broken release rather than a red PR.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Same source of truth as the release build — go.mod's `go` directive.
          go-version-file: go.mod

      - name: Check formatting
        run: |
          set -euo pipefail
          # gofmt's own exit status ignores formatting, so test for output.
          #
          # This runs the gofmt of the Go that setup-go installed from go.mod.
          # Locally, prefer
          # `go fmt ./...` over bare `gofmt` — gofmt is a standalone binary
          # that does NOT honour GOTOOLCHAIN, so a system gofmt of a different
          # vintage can format differently than this gate expects.
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean. Run 'gofmt -w .' and commit:"
            printf '%s\n' "$unformatted" | while read -r f; do
              echo "::error file=$f::$f needs gofmt"
            done
            gofmt -d .
            exit 1
          fi
          echo "✓ gofmt clean"

      - name: install.ps1 must be pure ASCII
        run: |
          set -euo pipefail
          # Windows PowerShell 5.1 reads a BOM-less .ps1 *file* as Windows-1252
          # rather than UTF-8, so one non-ASCII byte corrupts the string around
          # it and the script stops parsing partway down. install.dibbla.com
          # serves the file without a BOM and adding one would change the bytes
          # the mirror publishes, so the file stays ASCII instead.
          #
          # This is cheap to assert and easy to reintroduce: an em dash typed
          # into a comment is invisible in review. See DIB-324.
          if LC_ALL=C grep -nP '[^\x00-\x7F]' docs/install.ps1; then
            echo "::error file=docs/install.ps1::non-ASCII characters break parsing under Windows PowerShell 5.1; use plain ASCII (e.g. '--' rather than an em dash)"
            exit 1
          fi
          echo "install.ps1 is ASCII-only"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
