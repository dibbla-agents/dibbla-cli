version: 2

project_name: dibbla

before:
  hooks:
    - go mod tidy

builds:
  - id: dibbla
    main: ./cmd/dibbla
    binary: dibbla
    ldflags:
      - -s -w
      - -X github.com/dibbla-agents/dibbla-cli/internal/cmd.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "dibbla_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: tar.gz
    format_overrides:
      - goos: windows
        formats: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  github:
    owner: dibbla-agents
    name: dibbla-cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

# NOTE: there is deliberately no `brews`/`homebrew_casks` block here.
#
# GoReleaser used to push the Homebrew formula as the last step of its
# publish phase. That was wrong twice over:
#
#   1. It published checksums for the *unsigned* darwin tarballs, which the
#      sign-macos job then replaced — leaving a window where `brew install`
#      failed on a checksum mismatch.
#   2. A failure there (e.g. an expired tap token) aborted the whole release
#      job, silently skipping macOS/Windows code signing in downstream jobs.
#      That is exactly what broke v1.2.47–v1.2.51.
#
# The tap is now rendered from .github/homebrew/dibbla.rb.tmpl by the
# `homebrew` job in release.yml, which runs *after* signing against the
# final checksums. See that workflow for the ordering.

nfpms:
  - id: dibbla-deb
    package_name: dibbla
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    ids:
      - dibbla

    formats:
      - deb
      - rpm

    bindir: /usr/bin

    vendor: "Dibbla Agents"
    homepage: "https://dibbla.com"
    description: "Dibbla CLI for managing Dibbla applications"
    # Required by deb/rpm; GoReleaser deprecation-warns when unset.
    maintainer: "Dibbla Agents <support@dibbla.com>"